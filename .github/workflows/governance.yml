name: Governance

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: governance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance:
    name: governance
    runs-on: ubuntu-latest
    timeout-minutes: 5

    # Every gate below carries an `if:` naming cancelled(), because a step
    # without one carries an implicit success() and is therefore skipped by any
    # earlier failure. These gates are independent objections: a run that stops
    # at the first one reports one objection per push, and in the summary a
    # skipped step and a passing step look alike, so a check that never started
    # reads as a check that agreed.
    #
    # `!cancelled()` and not `always()`: cancel-in-progress is set above, and
    # under always() a job already replaced by a newer push would keep working.
    # Real dependencies are not erased by this, they are declared by name with
    # `steps.<id>.outcome == 'success'`. The verifier refuses a gate step that
    # omits the condition, reading each step separately.
    steps:
      - name: Check out repository
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the published content
        # This repository is public and sets policy for private ones. Its
        # strictest rule was also the only one with no check behind it, which
        # made it the rule with the worst failure mode and the least protection.
        #
        # It reads the tree, so the checkout is a real dependency and is named.
        id: public-content
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: python3 tools/quality/verify_public_content.py

      - name: Test the check itself
        # A gate nobody has verified is a gate nobody should trust. These tests
        # already caught one pattern that silently matched nothing.
        #
        # Same dependency, and no dependency on the gate above: the tests are a
        # separate objection and must be heard when the content check fails.
        id: verifier-tests
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: python3 -m unittest discover -s tests

      - name: Check the branch name
        # CONTRIBUTING allows feature/, fix/ and chore/ and nothing else. The
        # obvious home for this is a ruleset, and that was tried: GitHub accepts
        # a branch_name_pattern rule, reports it as applying to the branch, and
        # then does not enforce it, because metadata restrictions need an
        # Enterprise plan. A branch called BadName_2 pushed cleanly with the rule
        # active. A gate that cannot fail is worse than no gate, because it gets
        # trusted, so the rule lives here instead where it demonstrably fails.
        #
        # This does not prevent the branch from being created. It prevents it
        # from being merged, which is the point at which the name becomes
        # permanent.
        #
        # The checkout is deliberately absent from the condition: this gate
        # reads an event field and no file, so it is the one gate that can still
        # speak when the checkout itself failed. Declaring a dependency it does
        # not have would silence it for nothing.
        id: branch-name
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          case "$BRANCH" in
            dependabot/*)
              echo "$BRANCH is Dependabot's to name" ;;
            *)
              if echo "$BRANCH" | grep -qE '^(feature|fix|chore)/[a-z0-9][a-z0-9-]*$'; then
                echo "$BRANCH is a permitted branch name"
              else
                echo "::error::'$BRANCH' is not a permitted branch name."
                echo "Use feature/<description>, fix/<description> or chore/<description>,"
                echo "lowercase with hyphens. Rename the branch and the pull request follows it."
                exit 1
              fi ;;
          esac
